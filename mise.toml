[settings]
experimental = true
minimum_release_age = "1d"
npm.package_manager = "bun"

[tools]
"npm:opencode-ai" = "1"

bun = "1"
hk = "1.54.0"
node = "24"
pkl = "0.32"
usage = "latest"

[tasks.roll]
description = "Roll dice using standard notation, e.g. 4d6dl1, 1d20+5"
run = "bun run scripts/roll.ts"
